name: Flutter Trigger Input CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  test_and_analyze:
    name: Test and Analyze
    runs-on: ubuntu-latest
    env:
      # Fix Node.js 20 deprecation warning and force newer version
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Essential for Gitleaks to scan history

      - name: 🛡️ Secret Scan (Gitleaks)
        if: ${{ !env.ACT }}
        uses: gitleaks/gitleaks-action@v2
        with:
          args: --verbose --redact --staged
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: 'stable'
          cache: true
          architecture: x64

      - name: 📦 Install dependencies (Package)
        run: flutter pub get

      - name: 🔍 Dependency Scan (Package)
        run: dart pub outdated --no-dev-dependencies --json

      - name: ✨ Check format
        run: dart format --set-exit-if-changed .

      - name: 🔍 Analyze code (Package)
        run: flutter analyze

      - name: 🧪 Run Unit Tests (Package)
        run: flutter test --coverage

      - name: 📦 Install dependencies (Example)
        run: |
          cd example
          flutter pub get

      - name: 🔍 Dependency Scan (Example)
        run: |
          cd example
          dart pub outdated --no-dev-dependencies --json

      - name: 🔍 Analyze code (Example)
        run: |
          cd example
          flutter analyze

      - name: 🏁 Check Publish Readiness
        run: dart pub publish --dry-run

  release:
    name: Create GitHub Release
    needs: test_and_analyze
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 📝 Extract Release Notes
        id: extract_notes
        run: |
          VERSION=$(echo ${{ github.ref_name }} | sed 's/v//')
          # Extract lines between the version header and the next header
          sed -n "/## $VERSION/,/## /p" CHANGELOG.md | grep -v "## $VERSION" | grep -v "## " > release_notes.md

      - name: 🏷️ Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
